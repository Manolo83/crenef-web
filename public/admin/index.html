<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Panel · CRENEF</title>
<link rel="icon" href="/img/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--azul:#16355F;--teal:#3FA39F;--niebla:#EEF4F5;--borde:#DCE6E9;--texto:#2B3B4A;--suave:#5E7385}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Open Sans',Verdana,sans-serif;color:var(--texto);background:var(--niebla);font-size:15px}
  h1,h2,h3{font-family:'Montserrat',sans-serif;color:var(--azul);margin:0 0 .5em}
  a{color:var(--teal)}
  .oculto{display:none!important}

  /* Acceso */
  .acceso{min-height:100vh;display:grid;place-items:center;padding:24px}
  .caja{background:#fff;border-radius:18px;padding:36px;max-width:380px;width:100%;box-shadow:0 12px 40px rgba(22,53,95,.12);text-align:center}
  .caja img{width:88px;margin:0 auto 18px}

  /* Estructura */
  header.barra{background:var(--azul);color:#fff;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:0;z-index:20}
  header.barra strong{font-family:'Montserrat',sans-serif;letter-spacing:.08em}
  header.barra a{color:#fff;font-size:.85rem}
  .pestanas{display:flex;gap:6px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--borde);padding:0 16px;position:sticky;top:53px;z-index:19}
  .pestana{border:0;background:transparent;font-family:'Montserrat',sans-serif;font-size:.86rem;font-weight:600;color:var(--suave);padding:15px 14px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
  .pestana.activa{color:var(--azul);border-bottom-color:var(--teal)}
  main{max-width:960px;margin:0 auto;padding:26px 18px 80px}
  section.panel{display:none}
  section.panel.activo{display:block}

  .tarjeta{background:#fff;border:1px solid var(--borde);border-radius:14px;padding:22px;margin-bottom:18px}
  .grupo-titulo{font-family:'Montserrat',sans-serif;font-size:.75rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);margin:0 0 16px}

  label{display:block;font-family:'Montserrat',sans-serif;font-size:.78rem;font-weight:600;color:var(--azul);margin-bottom:5px}
  input,textarea,select{width:100%;font-family:inherit;font-size:.95rem;color:var(--texto);padding:10px 12px;border:1px solid var(--borde);border-radius:9px;background:#fff}
  textarea{min-height:96px;resize:vertical;line-height:1.55}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(63,163,159,.15)}
  .campo{margin-bottom:16px}
  .fila{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:640px){.fila{grid-template-columns:1fr}}

  button{font-family:'Montserrat',sans-serif;font-weight:600;font-size:.85rem;border:0;border-radius:999px;padding:11px 22px;cursor:pointer}
  .btn{background:var(--teal);color:#fff}
  .btn:hover{background:#35908C}
  .btn-azul{background:var(--azul);color:#fff}
  .btn-linea{background:#fff;color:var(--azul);border:1.5px solid var(--borde)}
  .btn-borrar{background:#fff;color:#B32020;border:1.5px solid #F0C9C9}
  .btn-chico{padding:7px 14px;font-size:.78rem}
  .acciones{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

  .lista-items{display:grid;gap:10px;margin-bottom:18px}
  .item{background:#fff;border:1px solid var(--borde);border-radius:12px;padding:14px 16px;display:flex;justify-content:space-between;gap:14px;align-items:center}
  .item b{font-family:'Montserrat',sans-serif;color:var(--azul);font-size:.95rem}
  .item small{color:var(--suave);display:block;margin-top:2px}

  .aviso{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--azul);color:#fff;padding:12px 24px;border-radius:999px;font-size:.87rem;box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:50}
  .aviso.visible{opacity:1}
  .aviso.error{background:#B32020}
  .nota{color:var(--suave);font-size:.85rem;margin:-6px 0 16px}
  .pildora{display:inline-block;font-size:.72rem;font-family:'Montserrat',sans-serif;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--niebla);color:var(--azul)}
  .pildora.nueva{background:#FDF0D5;color:#8A5A00}
  .pildora.verde{background:#E4F5EC;color:#1B7A4B}
  .pildora.roja{background:#FDECEC;color:#B32020}
</style>
</head>
<body>

<div class="acceso" id="acceso">
  <form class="caja" id="form-acceso">
    <img src="/img/logo-crenef.png" alt="CRENEF">
    <h1 style="font-size:1.1rem">Panel de administración</h1>
    <p style="color:var(--suave);font-size:.88rem">Entra con la contraseña de la clínica.</p>
    <div class="campo" style="text-align:left;margin-top:18px">
      <label for="password">Contraseña</label>
      <input type="password" id="password" autocomplete="current-password" required>
    </div>
    <button class="btn" type="submit" style="width:100%">Entrar</button>
    <p id="error-acceso" style="color:#B32020;font-size:.85rem;margin:14px 0 0"></p>
  </form>
</div>

<div id="app" class="oculto">
  <header class="barra">
    <strong>CRENEF · Panel</strong>
    <div class="acciones">
      <a href="/" target="_blank" rel="noopener">Ver el sitio ↗</a>
      <button class="btn-linea btn-chico" id="salir" type="button">Salir</button>
    </div>
  </header>

  <nav class="pestanas" id="pestanas"></nav>

  <main>
    <section class="panel" id="panel-contenido"></section>
    <section class="panel" id="panel-servicios"></section>
    <section class="panel" id="panel-areas"></section>
    <section class="panel" id="panel-faqs"></section>
    <section class="panel" id="panel-listas"></section>
    <section class="panel" id="panel-solicitudes"></section>
  </main>
</div>

<div class="aviso" id="aviso"></div>

<script src="/js/admin.js"></script>
</body>
</html>
